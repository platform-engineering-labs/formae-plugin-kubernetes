# velero — generated from the plugin-factory corpus, then free to hand-edit.
# Selected for the pre-rollback trait.
chart: velero
repoURL: https://vmware-tanzu.github.io/helm-charts/
version: 12.0.3

trait: pre-rollback
traitObject: "ServiceAccount/velero-server-upgrade-crds"

# Without these velero installs a BackupStorageLocation whose own CRD rejects it
# for having no credentials. The chart renders fine bare; installing is what
# needs them. None of this touches the upgrade-crds hook the trait asserts on.
#
# The empty lists are load-bearing twice over: they are also what exposed formae
# dropping explicitly-empty collections from values.
values:
  credentials:
    useSecret: false
  snapshotsEnabled: false
  configuration:
    backupStorageLocation: []
    volumeSnapshotLocation: []

notes: >-
  Artifact Hub rank 29. Installed bare, with no values
  overrides, so a failure here is the chart's prerequisites rather than
  formae's behaviour.
