name: Helm stability (PR)

# Kills the agent and the plugin mid-install and asserts a Helm release is never
# left holding Helm's pending lock. See test/helm-stability/README.md.
#
# Runs on every PR regardless of base branch, unlike ci.yml and
# conformance-pr.yml which filter on `branches: [main]`. Deliberate: this work
# lands on feature branches first, and a suite that only runs once something
# reaches main cannot stop a regression getting there.
#
# Self-contained rather than reusing conformance-version.yml's prepare job: this
# needs no schema fixtures, no per-K8s-minor matrix and no discovery, so a single
# job that builds formae and runs one suite is both faster and easier to read.
on:
  pull_request:
  workflow_dispatch:
    inputs:
      formae_ref:
        description: 'Immutable formae source revision'
        required: false
        default: '61b8155ada280ad4a70c59915cba37cf55709906'
        type: string
      formae_version:
        description: 'Canonical formae version baked into the binary'
        required: false
        default: '0.90.2'
        type: string
      drain_samples:
        description: 'Optional SIGTERM drain samples (0 = skip; the strict scenario remains the gate)'
        required: false
        default: '0'
        type: string

concurrency:
  group: helm-stability-${{ github.ref }}
  cancel-in-progress: true

jobs:
  helm-stability:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FORMAE_REF: ${{ inputs.formae_ref || '61b8155ada280ad4a70c59915cba37cf55709906' }}
      FORMAE_VERSION: ${{ inputs.formae_version || '0.90.2' }}
    steps:
      - uses: actions/checkout@v7

      - name: Record plugin source
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          echo "PLUGIN_GO_MOD_SHA=$(sha256sum go.mod | cut -d' ' -f1)" >> "$GITHUB_ENV"
          echo "PLUGIN_GO_SUM_SHA=$(sha256sum go.sum | cut -d' ' -f1)" >> "$GITHUB_ENV"

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: false

      - name: Restore Go module cache
        uses: actions/cache@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: gomod-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            gomod-${{ runner.os }}-

      - uses: pkl-community/setup-pkl@v0
        with:
          pkl-version: 0.30.0

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: formae-stability
          node_image: "kindest/node:v1.36.1@sha256:3489c7674813ba5d8b1a9977baea8a6e553784dab7b84759d1014dbd78f7ebd5"

      - name: Build exact formae source
        run: |
          set -euo pipefail
          git init /tmp/formae
          git -C /tmp/formae remote add origin https://github.com/platform-engineering-labs/formae.git
          git -C /tmp/formae fetch --depth 1 origin "$FORMAE_REF"
          git -C /tmp/formae checkout --detach FETCH_HEAD
          test "$(git -C /tmp/formae rev-parse HEAD)" = "$FORMAE_REF"
          make -C /tmp/formae build VERSION="$FORMAE_VERSION"
          sudo mkdir -p /opt/pel/bin
          sudo install -m 0755 /tmp/formae/formae /opt/pel/bin/formae
          echo "/opt/pel/bin" >> "$GITHUB_PATH"

      - name: Verify and log source identities
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          test "$(git -C /tmp/formae rev-parse HEAD)" = "$FORMAE_REF"
          echo "plugin sha=$(git rev-parse HEAD)"
          echo "core sha=$(git -C /tmp/formae rev-parse HEAD)"
          echo "core version=${FORMAE_VERSION}"
          /opt/pel/bin/formae --version
          go list -m all
          test "$(sha256sum go.mod | cut -d' ' -f1)" = "$PLUGIN_GO_MOD_SHA"
          test "$(sha256sum go.sum | cut -d' ' -f1)" = "$PLUGIN_GO_SUM_SHA"

      - name: Run the stability suite
        # make helm-stability-test depends on install, so the agent spawns the
        # plugin built from this PR rather than whatever was installed last.
        env:
          FORMAE_BINARY: /opt/pel/bin/formae
          STABILITY_KUBE_VERSION: "1.36"
          SAMPLES: ${{ github.event.inputs.drain_samples || '0' }}
        run: make helm-stability-test

      - name: Agent log on failure
        if: failure()
        run: |
          echo "=== agent log (tail) ==="
          tail -300 ~/.pel/formae/log/helm-stability-ci.log || true
          echo "=== helm releases ==="
          kubectl get secrets -A -l owner=helm \
            -o custom-columns=NS:.metadata.namespace,NAME:.metadata.labels.name,STATUS:.metadata.labels.status,REV:.metadata.labels.version \
            || true
