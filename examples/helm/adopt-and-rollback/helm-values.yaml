# Values for the `helm install` that seeds this demo's release.
#
# Must stay identical to the `values` block in kratos.pkl. If they diverge, the
# adopted release shows a values diff on top of the version diff and the demo
# stops measuring one change at a time.
kratos:
  development: true
  automigration:
    enabled: true
    type: job
  config:
    dsn: memory
    secrets:
      default:
        - abcdefghijklmnopqrstuvwxyz123456
    selfservice:
      default_browser_return_url: "http://127.0.0.1/"
      flows:
        settings:
          ui_url: "http://127.0.0.1/settings"
    identity:
      default_schema_id: default
      schemas:
        - id: default
          url: file:///etc/config/identity.default.schema.json
  identitySchemas:
    "identity.default.schema.json": |
      {
        "$id": "https://schemas.ory.sh/presets/kratos/identity.email.schema.json",
        "$schema": "http://json-schema.org/draft-07/schema#",
        "title": "Person",
        "type": "object",
        "properties": {
          "traits": {
            "type": "object",
            "properties": {
              "email": {
                "type": "string",
                "format": "email",
                "title": "E-Mail",
                "ory.sh/kratos": {
                  "credentials": { "password": { "identifier": true } },
                  "verification": { "via": "email" },
                  "recovery": { "via": "email" }
                }
              }
            },
            "required": ["email"],
            "additionalProperties": false
          }
        }
      }
